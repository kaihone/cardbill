<h1>CardBill</h1>
<p class="sub">個人用 macOS 信用卡帳單整理工具</p>
<p>CardBill 是一個在使用者自己的 Mac 上執行的個人 App。它會從使用者的 Gmail 讀取銀行寄來的信用卡電子帳單，
在本機解密、解析，整理成帳單列表、繳費提醒與消費統計。</p>
<ul>
  <li>只申請 Gmail <strong>唯讀</strong>權限（<code>gmail.readonly</code>），只讀取帳單相關信件。</li>
  <li>所有資料都存在使用者自己的電腦上，不會上傳到任何伺服器。</li>
  <li>本 App 不對外提供服務，僅供開發者本人使用。</li>
</ul>
<p><a href="privacy.html">隱私權政策</a></p>
